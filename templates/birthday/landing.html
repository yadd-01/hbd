<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday - Lisa</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .gradient-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0d0221, #150734, #1a0a47, #0d0221);
            z-index: 0;
        }

        .aurora {
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(255, 107, 157, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(196, 77, 255, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 20%, rgba(255, 215, 0, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 107, 157, 0.1) 0%, transparent 50%);
            animation: auroraMove 15s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes auroraMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5%, 3%) rotate(5deg); }
            50% { transform: translate(-3%, 5%) rotate(-3deg); }
            75% { transform: translate(-5%, -3%) rotate(3deg); }
        }

        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        .hearts-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 3;
        }

        .heart-particle {
            position: absolute;
            animation: floatUp linear infinite;
            opacity: 0.6;
            filter: drop-shadow(0 0 10px currentColor);
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 0.6; transform: translateY(90vh) rotate(36deg) scale(1); }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg) scale(0.5); opacity: 0; }
        }

        .rose-petal {
            position: fixed;
            animation: petalFall linear infinite;
            z-index: 3;
        }

        @keyframes petalFall {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(110vh) rotate(720deg) translateX(100px); opacity: 0; }
        }

        .landing-container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        .sparkle-ring {
            width: 200px; height: 200px;
            margin: 0 auto 30px;
            border-radius: 50%;
            border: 3px solid transparent;
            background: linear-gradient(#0d0221, #0d0221) padding-box,
                        linear-gradient(135deg, #FFD700, #FF6B9D, #C44DFF, #FFD700) border-box;
            background-size: 300% 300%;
            animation: ringGlow 3s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            animation: ringGlow 3s ease-in-out infinite, float 3s ease-in-out infinite;
        }

        @keyframes ringGlow {
            0%, 100% { background-position: 0% 50%; box-shadow: 0 0 40px rgba(255, 215, 0, 0.3); }
            50% { background-position: 100% 50%; box-shadow: 0 0 80px rgba(255, 107, 157, 0.5); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .subtitle {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            color: #FFE5F0;
            margin-bottom: 15px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.5s;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 5rem;
            background: linear-gradient(135deg, #FFD700, #FF6B9D, #C44DFF, #FFD700);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 4s ease infinite;
            margin-bottom: 20px;
            opacity: 0;
            text-shadow: none;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.3));
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .name {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #FFFFFF;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 1.5s;
        }

        .typewriter {
            overflow: hidden;
            border-right: 3px solid #FFD700;
            white-space: nowrap;
            display: inline-block;
            animation: typewriter 2s steps(20) forwards 2s,
                       blink 0.75s step-end infinite;
            width: 0;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
        }

        @keyframes typewriter { to { width: 100%; } }
        @keyframes blink { 50% { border-color: transparent; } }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 50px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 2.5s;
        }

        .countdown-box {
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.2), rgba(196, 77, 255, 0.2));
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px 20px;
            min-width: 90px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .countdown-box:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 107, 157, 0.3);
            border-color: rgba(255, 215, 0, 0.5);
        }

        .countdown-number {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFD700, #FF6B9D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
        }

        .countdown-label {
            font-size: 0.8rem;
            color: #FFE5F0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
        }

        .btn-gift {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            padding: 20px 55px;
            background: linear-gradient(135deg, #FFD700, #FFA500, #FFD700);
            background-size: 200% 200%;
            color: #0d0221;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.4s ease;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 3s, btnGradient 3s ease infinite 3s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.4);
        }

        @keyframes btnGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-gift:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 60px rgba(255, 215, 0, 0.6);
        }

        .music-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.3), rgba(196, 77, 255, 0.3));
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.5);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            z-index: 100;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 3.5s;
        }

        .music-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
        }

        .music-btn.playing {
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @media (max-width: 768px) {
            .title { font-size: 3rem; }
            .name { font-size: 2rem; }
            .countdown-container { gap: 8px; }
            .countdown-box { min-width: 70px; padding: 18px 12px; }
            .countdown-number { font-size: 1.8rem; }
            .btn-gift { padding: 16px 40px; font-size: 1rem; }
            .sparkle-ring { width: 150px; height: 150px; font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    <div class="aurora"></div>
    <div class="stars" id="stars"></div>
    <div class="hearts-bg" id="hearts-bg"></div>

    <div class="landing-container">
        <div class="sparkle-ring">💝</div>
        
        <p class="subtitle">✨ Untukmu Yang Istimewa ✨</p>
        <h1 class="title">Happy Birthday</h1>
        <div class="name">
            <span class="typewriter" id="name-text">Lisa sevtiana putri</span>
        </div>

        <div class="countdown-container">
            <div class="countdown-box">
                <span class="countdown-number" id="days">00</span>
                <span class="countdown-label">Hari</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-number" id="hours">00</span>
                <span class="countdown-label">Jam</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-number" id="minutes">00</span>
                <span class="countdown-label">Menit</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-number" id="seconds">00</span>
                <span class="countdown-label">Detik</span>
            </div>
        </div>

        <button class="btn-gift" onclick="openGift()">
            🎁 Buka Hadiah 🎁
        </button>
    </div>

    <button class="music-btn" id="music-btn" onclick="toggleMusic()">🔇</button>

    <audio id="bg-music" loop>
        <source src="/static/music/Lovers Rock - TV Girl.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Countdown Timer
        function updateCountdown() {
            const targetDate = new Date('2026-09-04T00:00:00').getTime();
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance > 0) {
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = days.toString().padStart(2, '0');
                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            } else {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
            }
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Create Stars
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 120; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 1) + 's';
                container.appendChild(star);
            }
        }

        // Create Floating Hearts
        function createHearts() {
            const container = document.getElementById('hearts-bg');
            const hearts = ['❤️', '💕', '💖', '💗', '💝', '💘', '🌹', '✨'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 6 + 6) + 's';
                heart.style.fontSize = (Math.random() * 20 + 12) + 'px';
                heart.style.color = ['#FF6B9D', '#C44DFF', '#FFD700'][Math.floor(Math.random() * 3)];
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 12000);
            }, 400);
        }

        // Rose Petals
        function createPetals() {
            setInterval(() => {
                const petal = document.createElement('div');
                petal.className = 'rose-petal';
                petal.textContent = ['🌸', '🩷', '✿', '💖'][Math.floor(Math.random() * 4)];
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationDuration = (Math.random() * 5 + 8) + 's';
                petal.style.fontSize = (Math.random() * 15 + 10) + 'px';
                petal.style.opacity = Math.random() * 0.3 + 0.2;
                document.body.appendChild(petal);
                setTimeout(() => petal.remove(), 13000);
            }, 600);
        }

        // Music Toggle
        let isPlaying = false;
        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.textContent = '🔇';
                musicBtn.classList.remove('playing');
            } else {
                music.play().catch(e => console.log('Autoplay prevented'));
                musicBtn.textContent = '🔊';
                musicBtn.classList.add('playing');
            }
            isPlaying = !isPlaying;
        }

        // Open Gift
        function openGift() {
            createCelebration();
            setTimeout(() => { window.location.href = '/main/'; }, 1500);
        }

        // Celebration Effect
        function createCelebration() {
            const colors = ['#FF6B9D', '#C44DFF', '#FFD700', '#FFE5F0', '#FFFFFF'];
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.width = Math.random() * 12 + 5 + 'px';
                    confetti.style.height = Math.random() * 12 + 5 + 'px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.left = '50%';
                    confetti.style.top = '50%';
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.pointerEvents = 'none';
                    confetti.style.zIndex = '1000';
                    document.body.appendChild(confetti);
                    
                    const angle = Math.random() * Math.PI * 2;
                    const velocity = Math.random() * 250 + 100;
                    const vx = Math.cos(angle) * velocity;
                    const vy = Math.sin(angle) * velocity;
                    let x = 0, y = 0, rotation = 0;
                    
                    const animate = () => {
                        x += vx * 0.02;
                        y += vy * 0.02 + 2;
                        rotation += 10;
                        confetti.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;
                        confetti.style.opacity = 1 - (y / 500);
                        if (y < 500) requestAnimationFrame(animate);
                        else confetti.remove();
                    };
                    requestAnimationFrame(animate);
                }, i * 10);
            }
        }

        createStars();
        createHearts();
        createPetals();
    </script>
</body>
</html>
