<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk ke Hati 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .gradient-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0d0221, #150734, #1a0a47, #0d0221);
            z-index: 0;
        }

        .aurora {
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(255, 107, 157, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(196, 77, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 20%, rgba(255, 215, 0, 0.1) 0%, transparent 50%);
            animation: auroraMove 15s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes auroraMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5%, 3%) rotate(5deg); }
            50% { transform: translate(-3%, 5%) rotate(-3deg); }
            75% { transform: translate(-5%, -3%) rotate(3deg); }
        }

        .hearts-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }

        .heart-particle {
            position: absolute;
            animation: floatUp linear infinite;
            opacity: 0.6;
            filter: drop-shadow(0 0 10px currentColor);
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 0.6; transform: translateY(90vh) rotate(36deg) scale(1); }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg) scale(0.5); opacity: 0; }
        }

        .sparkles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .sparkle {
            position: absolute;
            width: 4px; height: 4px;
            background: #FFD700;
            border-radius: 50%;
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        .login-container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lock-icon {
            width: 120px; height: 120px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.3), rgba(196, 77, 255, 0.3));
            backdrop-filter: blur(20px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5rem;
            border: 3px solid rgba(255, 215, 0, 0.5);
            animation: float 3s ease-in-out infinite, glowPulse 2s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3), inset 0 0 30px rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.3), inset 0 0 30px rgba(255, 255, 255, 0.1); }
            50% { box-shadow: 0 0 60px rgba(255, 215, 0, 0.5), inset 0 0 40px rgba(255, 255, 255, 0.2); }
        }

        .login-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            background: linear-gradient(135deg, #FFD700, #FF6B9D, #C44DFF, #FFD700);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 4s ease infinite;
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.3s, gradientText 4s ease infinite 1.3s;
            width: 100%;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-subtitle {
            font-size: 1rem;
            color: #FFE5F0;
            margin-bottom: 35px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.5s;
            letter-spacing: 2px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-box {
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.15), rgba(196, 77, 255, 0.15));
            backdrop-filter: blur(25px);
            padding: 45px 40px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            width: 420px;
            max-width: 90vw;
            margin: 0 auto;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.7s;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.4),
                0 0 80px rgba(255, 107, 157, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            animation: shine 3s ease-in-out infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
            position: relative;
            z-index: 1;
        }

        .input-group label {
            display: block;
            color: #FFE5F0;
            margin-bottom: 10px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 18px 25px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 1.1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.4s ease;
            outline: none;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .input-group input:focus {
            border-color: #FFD700;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2), 0 0 60px rgba(255, 107, 157, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #FF6B9D, #C44DFF, #FF6B9D);
            background-size: 200% 200%;
            color: white;
            font-size: 1.2rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
            z-index: 1;
            animation: btnGradient 3s ease infinite;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
        }

        @keyframes btnGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 50px rgba(255, 107, 157, 0.5), 0 0 40px rgba(196, 77, 255, 0.3);
        }

        .error-message {
            background: linear-gradient(135deg, rgba(255, 100, 100, 0.3), rgba(255, 50, 50, 0.3));
            border: 1px solid rgba(255, 100, 100, 0.5);
            color: #FFE5F0;
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .hint-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-top: 25px;
            position: relative;
            z-index: 1;
        }

        .hint-text span {
            color: #FFD700;
            font-weight: 600;
        }

        .floating-decor {
            position: fixed;
            font-size: 3rem;
            opacity: 0.15;
            z-index: 1;
            filter: blur(1px);
        }

        .floating-decor:nth-child(1) { top: 8%; left: 8%; animation: floatDecor 6s ease-in-out infinite; }
        .floating-decor:nth-child(2) { top: 12%; right: 12%; animation: floatDecor 6s ease-in-out infinite 1s; }
        .floating-decor:nth-child(3) { bottom: 20%; left: 12%; animation: floatDecor 6s ease-in-out infinite 2s; }
        .floating-decor:nth-child(4) { bottom: 15%; right: 8%; animation: floatDecor 6s ease-in-out infinite 0.5s; }
        .floating-decor:nth-child(5) { top: 50%; left: 5%; animation: floatDecor 6s ease-in-out infinite 1.5s; }
        .floating-decor:nth-child(6) { top: 40%; right: 5%; animation: floatDecor 6s ease-in-out infinite 2.5s; }

        @keyframes floatDecor {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .rose-petal {
            position: fixed;
            font-size: 1.5rem;
            opacity: 0.3;
            animation: petalFall linear infinite;
            z-index: 2;
        }

        @keyframes petalFall {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(110vh) rotate(720deg) translateX(100px); opacity: 0; }
        }

        @media (max-width: 480px) {
            .login-title { font-size: 2.2rem; }
            .login-box { padding: 35px 25px; width: 95vw; }
            .lock-icon { width: 90px; height: 90px; font-size: 2.8rem; }
            .login-subtitle { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    <div class="aurora"></div>
    <div class="hearts-bg" id="hearts-bg"></div>
    <div class="sparkles" id="sparkles"></div>

    <div class="floating-decor">💕</div>
    <div class="floating-decor">💖</div>
    <div class="floating-decor">💗</div>
    <div class="floating-decor">💝</div>
    <div class="floating-decor">🌹</div>
    <div class="floating-decor">✨</div>

    <div class="login-container">
        <div class="lock-icon">🔐</div>
        
        <h1 class="login-title">Buka Hadiah Spesial</h1>
        <p class="login-subtitle">Masukkan nama dan password untuk membuka kejutan untuk Lisa</p>
        
        <div class="login-box">
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}
            
            <form method="POST" action="">
                {% csrf_token %}
                
                <div class="input-group">
                    <label>💕 NamaMu Sayang</label>
                    <input type="text" name="name" placeholder="Ketik namamu di sini..." autocomplete="off" required>
                </div>
                
                <div class="input-group">
                    <label>🔑 Password Spesial</label>
                    <input type="password" name="password" placeholder="Tanggal spesial kita..." autocomplete="off" required>
                </div>
                
                <button type="submit" class="login-btn">✨ Buka Cintaku ✨</button>
            </form>
            
            <p class="hint-text">💡 Hint: <span>tanggal spesial kita (contoh: 04 september)</span></p>
        </div>
    </div>

    <script>
        // Floating Hearts
        function createHearts() {
            const container = document.getElementById('hearts-bg');
            const hearts = ['❤️', '💕', '💖', '💗', '💝', '💘', '🌹', '✨'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 6 + 6) + 's';
                heart.style.fontSize = (Math.random() * 20 + 12) + 'px';
                heart.style.color = ['#FF6B9D', '#C44DFF', '#FFD700'][Math.floor(Math.random() * 3)];
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 12000);
            }, 400);
        }

        // Sparkles
        function createSparkles() {
            const container = document.getElementById('sparkles');
            for (let i = 0; i < 50; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + 'vw';
                sparkle.style.top = Math.random() * 100 + 'vh';
                sparkle.style.animationDelay = Math.random() * 3 + 's';
                sparkle.style.animationDuration = (Math.random() * 2 + 1) + 's';
                sparkle.style.width = sparkle.style.height = (Math.random() * 4 + 2) + 'px';
                sparkle.style.background = ['#FFD700', '#FF6B9D', '#C44DFF', '#FFFFFF'][Math.floor(Math.random() * 4)];
                container.appendChild(sparkle);
            }
        }

        // Rose Petals
        function createPetals() {
            setInterval(() => {
                const petal = document.createElement('div');
                petal.className = 'rose-petal';
                petal.textContent = ['🌸', '🩷', '✿'][Math.floor(Math.random() * 3)];
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationDuration = (Math.random() * 5 + 8) + 's';
                petal.style.fontSize = (Math.random() * 10 + 10) + 'px';
                document.body.appendChild(petal);
                setTimeout(() => petal.remove(), 13000);
            }, 800);
        }

        createHearts();
        createSparkles();
        createPetals();
    </script>
</body>
</html>
