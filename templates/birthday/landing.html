<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday - Untukmu</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        }

        .landing-container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .heart-particle {
            position: absolute;
            font-size: 20px;
            animation: floatUp linear infinite;
            opacity: 0.6;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FF6B9D, #C44DFF, #FF6B9D, #FFE5F0);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            z-index: 0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .subtitle {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            color: #FFE5F0;
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.5s;
            letter-spacing: 3px;
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #FFFFFF;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 1s;
        }

        .name {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 1.5s;
        }

        .typewriter {
            overflow: hidden;
            border-right: 3px solid #FFD700;
            white-space: nowrap;
            display: inline-block;
            animation: typewriter 2s steps(20) forwards 2s,
                       blink 0.75s step-end infinite;
            width: 0;
        }

        @keyframes typewriter {
            to { width: 100%; }
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 2.5s;
        }

        .countdown-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px 30px;
            min-width: 100px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .countdown-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
        }

        .countdown-number {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 700;
            color: #FFFFFF;
            display: block;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .countdown-label {
            font-size: 0.9rem;
            color: #FFE5F0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .btn-gift {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            padding: 18px 50px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a1a2e;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 3s,
                       glow 2s ease-in-out infinite 3s;
            position: relative;
            overflow: hidden;
        }

        .btn-gift::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s ease;
        }

        .btn-gift:hover::before {
            left: 100%;
        }

        .btn-gift:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.5);
        }

        @keyframes glow {
            0% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 165, 0, 0.4); }
            100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        }

        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #FFD700;
            border-radius: 50%;
            animation: sparkle 1.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes sparkle {
            0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1) rotate(180deg); opacity: 1; }
        }

        .music-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            transition: all 0.3s ease;
            z-index: 100;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 3.5s;
        }

        .music-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.3);
        }

        .music-btn.playing {
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            .name {
                font-size: 2rem;
            }
            .countdown-container {
                flex-wrap: wrap;
                gap: 10px;
            }
            .countdown-box {
                min-width: 80px;
                padding: 15px 20px;
            }
            .countdown-number {
                font-size: 2rem;
            }
            .btn-gift {
                padding: 15px 40px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    
    <div class="stars" id="stars"></div>
    
    <div class="hearts-bg" id="hearts-bg"></div>

    <div class="landing-container">
        <p class="subtitle">UNTUKMU YANG ISTIMEWA</p>
        <h1 class="title">Happy Birthday</h1>
        <div class="name">
            <span class="typewriter" id="name-text">Lisa sevtiana putri</span>
        </div>

        <div class="countdown-container">
            <div class="countdown-box">
                <span class="countdown-number" id="days">00</span>
                <span class="countdown-label">Hari</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-number" id="hours">00</span>
                <span class="countdown-label">Jam</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-number" id="minutes">00</span>
                <span class="countdown-label">Menit</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-number" id="seconds">00</span>
                <span class="countdown-label">Detik</span>
            </div>
        </div>

        <button class="btn-gift" onclick="openGift()">
            🎁 Buka Hadiah 🎁
        </button>
    </div>

    <button class="music-btn" id="music-btn" onclick="toggleMusic()">🔇</button>

    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Countdown Timer
        function updateCountdown() {
            const targetDate = new Date('2026-09-04T00:00:00').getTime();
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance > 0) {
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = days.toString().padStart(2, '0');
                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            } else {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Create Stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = (Math.random() * 2 + 1) + 's';
                starsContainer.appendChild(star);
            }
        }

        // Create Floating Hearts
        function createHearts() {
            const heartsContainer = document.getElementById('hearts-bg');
            const hearts = ['❤️', '💕', '💖', '💗', '💝', '💘'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                heartsContainer.appendChild(heart);
                
                setTimeout(() => heart.remove(), 10000);
            }, 500);
        }

        // Music Toggle
        let isPlaying = false;
        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.textContent = '🔇';
                musicBtn.classList.remove('playing');
            } else {
                music.play().catch(e => console.log('Autoplay prevented'));
                musicBtn.textContent = '🔊';
                musicBtn.classList.add('playing');
            }
            isPlaying = !isPlaying;
        }

        // Open Gift
        function openGift() {
            // Create confetti explosion
            createConfetti();
            
            // Redirect after animation
            setTimeout(() => {
                window.location.href = '/main/';
            }, 1500);
        }

        // Confetti Effect
        function createConfetti() {
            const colors = ['#FF6B9D', '#C44DFF', '#FFD700', '#FFE5F0', '#FFFFFF'];
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = Math.random() * 10 + 5 + 'px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.left = '50%';
                    confetti.style.top = '50%';
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.pointerEvents = 'none';
                    confetti.style.zIndex = '1000';
                    
                    document.body.appendChild(confetti);
                    
                    const angle = Math.random() * Math.PI * 2;
                    const velocity = Math.random() * 200 + 100;
                    const vx = Math.cos(angle) * velocity;
                    const vy = Math.sin(angle) * velocity;
                    
                    let x = 0, y = 0, rotation = 0;
                    const animate = () => {
                        x += vx * 0.02;
                        y += vy * 0.02 + 2;
                        rotation += 10;
                        
                        confetti.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;
                        confetti.style.opacity = 1 - (y / 500);
                        
                        if (y < 500) {
                            requestAnimationFrame(animate);
                        } else {
                            confetti.remove();
                        }
                    };
                    
                    requestAnimationFrame(animate);
                }, i * 10);
            }
        }

        // Initialize
        createStars();
        createHearts();
    </script>
</body>
</html>
