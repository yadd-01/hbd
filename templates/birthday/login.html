<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk ke Hati 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        }

        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FF6B9D, #C44DFF, #FF6B9D, #FFE5F0);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            z-index: 0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .heart-particle {
            position: absolute;
            font-size: 20px;
            animation: floatUp linear infinite;
            opacity: 0.5;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .login-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .lock-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .login-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #FFFFFF;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.3s;
        }

        .login-subtitle {
            font-size: 1.1rem;
            color: #FFE5F0;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.5s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 400px;
            max-width: 90vw;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.7s;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #FFE5F0;
            margin-bottom: 8px;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-group input:focus {
            border-color: #FFD700;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .input-icon {
            display: inline-block;
            margin-right: 10px;
            font-size: 1.2rem;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #FF6B9D, #C44DFF);
            color: white;
            font-size: 1.2rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.5);
        }

        .error-message {
            background: rgba(255, 107, 157, 0.3);
            border: 1px solid rgba(255, 107, 157, 0.5);
            color: #FFE5F0;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .hint-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            margin-top: 20px;
            font-style: italic;
        }

        .hint-text span {
            color: #FFD700;
        }

        .love-decor {
            position: fixed;
            font-size: 4rem;
            opacity: 0.1;
            z-index: 1;
        }

        .love-decor.top-left {
            top: 10%;
            left: 10%;
            animation: float 4s ease-in-out infinite;
        }

        .love-decor.top-right {
            top: 15%;
            right: 10%;
            animation: float 4s ease-in-out infinite 1s;
        }

        .love-decor.bottom-left {
            bottom: 15%;
            left: 15%;
            animation: float 4s ease-in-out infinite 2s;
        }

        .love-decor.bottom-right {
            bottom: 10%;
            right: 15%;
            animation: float 4s ease-in-out infinite 0.5s;
        }

        @media (max-width: 480px) {
            .login-title { font-size: 2.2rem; }
            .login-box { padding: 30px 25px; }
            .lock-icon { width: 80px; height: 80px; font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    <div class="stars" id="stars"></div>
    <div class="hearts-bg" id="hearts-bg"></div>

    <div class="love-decor top-left">💕</div>
    <div class="love-decor top-right">💖</div>
    <div class="love-decor bottom-left">💗</div>
    <div class="love-decor bottom-right">💝</div>

    <div class="login-container">
        <div class="lock-icon">🔐</div>
        
        <h1 class="login-title">Buka Hadiah Spesial</h1>
        <p class="login-subtitle">Masukkan nama dan password untuk membuka kejutan untuk Lisa</p>
        
        <div class="login-box">
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}
            
            <form method="POST" action="">
                {% csrf_token %}
                
                <div class="input-group">
                    <label><span class="input-icon">💕</span> Namaku Sayang</label>
                    <input type="text" name="name" placeholder=" Ketik namamu di sini..." autocomplete="off" required>
                </div>
                
                <div class="input-group">
                    <label><span class="input-icon">🔑</span> Password Spesial</label>
                    <input type="password" name="password" placeholder=" Tanggal spesial kita..." autocomplete="off" required>
                </div>
                
                <button type="submit" class="login-btn">✨ Buka Cintaku ✨</button>
            </form>
            
            <p class="hint-text">💡 Hint: <span>tanggal spesial kita</span></p>
        </div>
    </div>

    <script>
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = (Math.random() * 2 + 1) + 's';
                starsContainer.appendChild(star);
            }
        }

        function createHearts() {
            const heartsContainer = document.getElementById('hearts-bg');
            const hearts = ['❤️', '💕', '💖', '💗', '💝', '💘'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
                heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
                heartsContainer.appendChild(heart);
                
                setTimeout(() => heart.remove(), 10000);
            }, 600);
        }

        createStars();
        createHearts();
    </script>
</body>
</html>
